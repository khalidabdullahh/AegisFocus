name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install Android SDK Packages & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "✅ APK successfully generated at: $APK_FILE"
          mkdir -p release-assets
          cp "$APK_FILE" release-assets/AegisFocus-Latest.apk
          cp "$APK_FILE" release-assets/AegisFocus-v1.1.0.apk
          if [ -f "releases/AegisFocus-v1.0.0-Release.apk" ]; then
            cp releases/AegisFocus-v1.0.0-Release.apk release-assets/AegisFocus-v1.0.0.apk
          fi
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisFocus-Release-APKs
          path: release-assets/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Aegis Focus (Latest Release)"
          body: |
            ## 🛡️ Aegis Focus — Unbreakable Digital Discipline & Focus
            
            ### ✨ Highlights:
            - 🛡️ **100% Offline & Private**: Zero cloud tracking. All focus logs and rules live purely on your physical device.
            - 🔒 **Unbypassable Strict Mode**: Device Administrator lock prevents tampering, killing accessibility, or uninstallation during active focus.
            - 🧘 **Mindful Pause & Adaptive Friction**: 5s-30s escalating breathing delays break compulsive phone habits.
            - 🔑 **Cryptographic Offline License Engine**: Built-in HMAC SHA-256 license validator (`AEGIS-12M-XXXX-XXXX`).
            - 🔐 **Secured Super Admin Mobile Panel**: Embedded mobile license generator unlocked via master key `6924923086`.
            
            ---
            ### 📥 Download APKs:
            * **[AegisFocus-Latest.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/AegisFocus-Latest.apk)** *(Recommended)*
            * **[AegisFocus-v1.1.0.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/AegisFocus-v1.1.0.apk)** *(v1.1.0)*
            * **[AegisFocus-v1.0.0.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/AegisFocus-v1.0.0.apk)** *(Legacy v1.0.0)*
          draft: false
          prerelease: false
          files: |
            release-assets/AegisFocus-Latest.apk
            release-assets/AegisFocus-v1.1.0.apk
            release-assets/AegisFocus-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
