name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install Android SDK Packages & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "✅ APK successfully generated at: $APK_FILE"
          mkdir -p release-assets
          cp "$APK_FILE" release-assets/ASAR-Latest.apk
          cp "$APK_FILE" release-assets/ASAR-v1.0.0.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASAR-Latest-APK
          path: release-assets/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ASAR Focus v1.0.0 (Latest Release)"
          body: |
            ## 🚀 ASAR (Aegis Focus) Android Release
            
            ### ✨ What's New:
            - 🛡️ **Server-Authoritative Payment Queue**: bKash & Nagad instant TrxID submission & admin 1-tap activation.
            - 🔒 **Super Admin Portal**: Review and verify payment claims directly inside the app.
            - 💎 **Encrypted Licensing**: Server-validated license key generation and redemption.
            - ⚡ **Offline Discipline Guardrails**: Anti-tamper strict mode, focus XP level system, and distraction blocker.
            - 🔔 **Discord Telemetry Relay**: Real-time event notifications via secure Supabase Edge Function.
            
            ---
            ### 📥 Download & Install
            Click **[`ASAR-Latest.apk`](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/ASAR-Latest.apk)** below to install on your Android device.
          draft: false
          prerelease: false
          files: |
            release-assets/ASAR-Latest.apk
            release-assets/ASAR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
