name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install Android SDK Packages & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "✅ APK successfully generated at: $APK_FILE"
          mkdir -p release-assets
          cp "$APK_FILE" release-assets/AegisFocus-Latest.apk
          cp "$APK_FILE" release-assets/AegisFocus-v1.1.0.apk
          if [ -f "Barakah-Release.apk" ]; then
            cp Barakah-Release.apk release-assets/Barakah-Latest.apk
            cp Barakah-Release.apk release-assets/Barakah-v1.0.5.apk
          fi
          if [ -f "ASAR-Latest.apk" ]; then
            cp ASAR-Latest.apk release-assets/ASAR-Latest.apk
            cp ASAR-Latest.apk release-assets/ASAR-v1.0.0.apk
          elif [ -f "releases/ASAR-v1.0.0-Release.apk" ]; then
            cp releases/ASAR-v1.0.0-Release.apk release-assets/ASAR-Latest.apk
            cp releases/ASAR-v1.0.0-Release.apk release-assets/ASAR-v1.0.0.apk
          fi
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisFocus-All-Release-APKs
          path: release-assets/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Aegis Focus (Latest Release & Archive)"
          body: |
            ## 🛡️ Aegis Focus — Complete Release Archive

            Download current and previous versions of Aegis Focus, Barakah Focus, and ASAR Focus:

            ---
            ### 📥 Aegis Focus (Current - Recommended)
            * **[AegisFocus-Latest.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/AegisFocus-Latest.apk)** *(v1.1.0 Latest • AdBlock DNS + Shorts Blocker + Monk Shield)*
            * **[AegisFocus-v1.1.0.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/AegisFocus-v1.1.0.apk)** *(v1.1.0 Tagged)*

            ---
            ### 🌙 Barakah Focus (Special Bengali / Spiritual Edition)
            * **[Barakah-Latest.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/Barakah-Latest.apk)** *(v1.0.5 • Dual Slogan + Apple Typography)*
            * **[Barakah-v1.0.5.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/Barakah-v1.0.5.apk)** *(v1.0.5 Tagged)*

            ---
            ### ⚡ ASAR Focus (Legacy Foundation Edition)
            * **[ASAR-Latest.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/ASAR-Latest.apk)** *(v1.0.0 Legacy Foundation)*
            * **[ASAR-v1.0.0.apk](https://github.com/khalidabdullahh/AegisFocus/releases/latest/download/ASAR-v1.0.0.apk)** *(v1.0.0 Tagged)*

            ---
            ### 🔒 Integrity & Security:
            * All builds are signed with official keystores and 100% on-device private.
            * Master Super Admin key for offline key generator: `6924923086`.
          draft: false
          prerelease: false
          files: |
            release-assets/AegisFocus-Latest.apk
            release-assets/AegisFocus-v1.1.0.apk
            release-assets/Barakah-Latest.apk
            release-assets/Barakah-v1.0.5.apk
            release-assets/ASAR-Latest.apk
            release-assets/ASAR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
