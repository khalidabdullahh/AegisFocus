<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
    <!-- Background (optional dark canvas) -->
    <rect width="400" height="240" rx="16" fill="#0A0D14"/>

    <!-- Stylized Monogram Mark: Sharp Stem, Dynamic Angles, Curved Horizon Arc -->
    <g transform="translate(140, 30)">
        <!-- K Left Vertical Stem -->
        <path d="M12 10 L12 85" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

        <!-- K Upper Diagonal Branch -->
        <path d="M52 12 L14 48" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- K Lower Diagonal / A Left Diagonal connecting -->
        <path d="M22 42 L56 85" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>

        <!-- A Peak and Right Leg -->
        <path d="M52 12 L78 85" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

        <!-- Iconic Dynamic Sweeping Curve Arc (Inspired by the Reference Monogram) -->
        <path d="M8 82 Q 45 42, 85 70" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Subtitle: KHALID ABDULLAH with wide tracking -->
    <text x="200" y="170" 
          text-anchor="middle" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-weight="600" 
          font-size="14" 
          letter-spacing="9" 
          fill="#F8FAFC">KHALID ABDULLAH</text>

    <!-- Tagline: TURN TIME INTO PROGRESS -->
    <text x="200" y="195" 
          text-anchor="middle" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-weight="500" 
          font-size="9" 
          letter-spacing="4" 
          fill="#94A3B8">ASR · TURN TIME INTO PROGRESS</text>
</svg>
