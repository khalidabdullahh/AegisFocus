<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
    <!-- Background Canvas -->
    <rect width="500" height="280" rx="16" fill="#0A0D14"/>

    <!-- ASR Interlocking Geometric Monogram Mark -->
    <g transform="translate(135, 30)">
        <!-- 'A' Left Leg & Apex -->
        <path d="M15 90 L50 15 L85 90" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 'A' Crossbar (styled) -->
        <path d="M30 62 L70 62" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>

        <!-- 'S' Geometric Central Spine (interlocking with A and R) -->
        <path d="M125 22 C95 15, 80 32, 105 48 C130 62, 115 85, 85 85" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" fill="none"/>

        <!-- 'R' Right Stem, Loop and Leg -->
        <path d="M145 18 L145 90" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M145 18 H180 C198 18, 198 52, 180 52 H145" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M168 52 L198 90" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>

        <!-- Signature Dynamic Horizon Swoosh Arc (Inspired by Reference Image) -->
        <path d="M5 86 Q 105 38, 220 74" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Primary Typography: A S R -->
    <text x="250" y="195" 
          text-anchor="middle" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="22" 
          letter-spacing="14" 
          fill="#F8FAFC">A S R</text>

    <!-- Tagline: TURN TIME INTO PROGRESS -->
    <text x="250" y="228" 
          text-anchor="middle" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-weight="600" 
          font-size="9" 
          letter-spacing="6" 
          fill="#38BDF8">TURN TIME INTO PROGRESS</text>
</svg>
